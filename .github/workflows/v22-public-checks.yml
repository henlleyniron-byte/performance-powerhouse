name: V22 public preview and browser checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - name: Verify the archived snapshot
        run: python3 scripts/verify-v22-source.py
      - name: Run legacy service worker checks
        run: npm test
      - name: Install the test dependencies
        run: npm ci --prefix qa --no-audit --no-fund
      - name: Run V22 source and DOM tests
        run: npm run unit --prefix qa
      - name: Install browser engines
        working-directory: qa
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Exercise the public preview in real browsers
        run: npm run browser --prefix qa
      - name: Upload failure traces from fictional test profiles
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v22-browser-traces
          path: qa/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
