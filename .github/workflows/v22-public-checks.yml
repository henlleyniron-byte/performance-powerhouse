name: V22 public preview and browser checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - name: Verify the archived snapshot
        run: python3 scripts/verify-v22-source.py
      - name: Run legacy service worker checks
        run: npm test
      - name: Install the test dependencies
        run: npm ci --prefix qa --no-audit --no-fund
      - name: Run V22 source and DOM tests
        run: npm run unit --prefix qa
      - name: Install browser engines
        working-directory: qa
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Exercise the public preview in real browsers
        run: npm run browser --prefix qa
