name: First attempt source checks
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/first-real-attempt-20261012"
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Node runtime
        run: node --version
      - name: Run bounded Node tests
        run: node --test tests/first-attempt-contract.test.mjs
