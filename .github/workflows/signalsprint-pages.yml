name: Deploy SignalSprint V2 to Pages
on:
  push:
    branches: [signalsprint-preview]
    paths:
      - 'sites/signalsprint-second-messenger/**'
      - '.github/workflows/signalsprint-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signalsprint-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload SignalSprint site
        uses: actions/upload-pages-artifact@v4
        with:
          path: sites/signalsprint-second-messenger
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
