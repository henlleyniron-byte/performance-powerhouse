name: Powerhouse flagship source integrity
on:
  pull_request:
    paths:
      - "hosted-source/**"
      - "docs/V22_SOURCE_MANIFEST.json"
      - "scripts/verify-v22-source.py"
      - "tests/**"
      - "sw.js"
      - "package.json"
      - ".github/workflows/flagship-source-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-and-legacy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify public V22 snapshot and redaction manifest
        run: python3 scripts/verify-v22-source.py
      - name: Run legacy service-worker and data contracts
        run: npm test
